<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#F2E9D8"/>

  <defs>
    <g id="spike">
      <path d="M-118,-52 L104,-14 L142,0 L104,14 L-118,52 L-72,0 Z" fill="#C92F35"/>
      <path d="M-72,0 L104,-14 L142,0 L104,14 Z" fill="#991F2A"/>
      <path d="M-118,-52 L104,-14 L62,-2 L-72,0 Z" fill="#E04A4E"/>
    </g>
  </defs>

  <!-- One continuous safe route. Its broad shape binds the six spikes into one mark. -->
  <path d="M302 716
           C220 625 237 526 353 475
           C458 429 496 385 469 302
           C445 230 475 173 553 140
           C454 160 391 220 402 305
           C416 409 370 438 282 485
           C167 547 170 663 302 716 Z"
        fill="#0A6670"/>

  <!-- Upper curved volley: three linked silhouettes. -->
  <g transform="translate(355 322) rotate(-34) scale(.82)"><use href="#spike"/></g>
  <g transform="translate(492 244) rotate(-18) scale(.91)"><use href="#spike"/></g>
  <g transform="translate(650 232) rotate(4) scale(1.02)"><use href="#spike"/></g>

  <!-- Lower curved volley: three linked silhouettes completing the counter-curve. -->
  <g transform="translate(674 654) rotate(146) scale(.82)"><use href="#spike"/></g>
  <g transform="translate(536 735) rotate(162) scale(.91)"><use href="#spike"/></g>
  <g transform="translate(376 748) rotate(184) scale(1.02)"><use href="#spike"/></g>

  <!-- Player/dodge point, intentionally offset from the geometric center. -->
  <circle cx="494" cy="503" r="35" fill="#172221"/>
</svg>
