name: Award season champions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/award-season-champions.yml"
      - "functions/**"
  schedule:
    # 00:15 JST every day. Daily reconciliation prevents a missed monthly run.
    - cron: "15 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: award-season-champions
  cancel-in-progress: false

jobs:
  award:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Firebase without a stored key
        uses: google-github-actions/auth@v2
        with:
          project_id: spike-dodge
          workload_identity_provider: projects/767051630609/locations/global/workloadIdentityPools/github-actions/providers/github-bulletdodge
          service_account: bulletdodge-season-awarder@spike-dodge.iam.gserviceaccount.com

      - name: Install locked dependencies
        working-directory: functions
        run: npm ci --ignore-scripts

      - name: Award every unprocessed completed season
        working-directory: functions
        run: npm run award

      - name: Keep scheduled workflows active
        if: success()
        run: |
          if [ "$(TZ=Asia/Tokyo date +%d)" != "01" ]; then exit 0; fi
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/season-award-heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/season-award-heartbeat
          git commit -m "chore: keep season awards active" || exit 0
          git push
